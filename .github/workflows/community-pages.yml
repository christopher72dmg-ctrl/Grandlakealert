name: Publish community information site

on:
  push:
    branches:
      - community-info-web
    paths:
      - "community/**"
      - ".github/workflows/community-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: community-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out community branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: community
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
