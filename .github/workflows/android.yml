name: Build Grand Lake Alert

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grand-lake-alert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Grand Lake Alert APK
          body: Automatically built debug APK from the latest main branch commit.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
